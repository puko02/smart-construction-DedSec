---
cloud_provider: gcp
target_environment: "{{ target_env | default('prod') }}"
gcp_project_id: "{{ project_id | default('projeto-mensal-515620') }}"
gcp_region: "{{ region | default('us-central1') }}"
gcp_zone: "{{ zone | default('us-central1-a') }}"

ansible_user: "{{ ssh_user | default('fabio') }}"
ansible_ssh_private_key_file: "{{ ssh_private_key_file | default('/home/fabio/.ssh/id_ed25519') }}"
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ProxyCommand="gcloud compute start-iap-tunnel %h %p --listen-on-stdin
  --project={{ gcp_project_id }} --zone={{ gcp_zone }}"

update_operating_system: false
extra_packages: []
base_packages:
  - ca-certificates
  - curl
  - git
  - util-linux
host_packages: []
docker_packages:
  - docker.io
  - docker-compose-v2
  - python3-docker

data_mountpoint: /srv/smart-construction-data
docker_data_root: /srv/smart-construction-data/docker
