app_directory: /opt/smart-construction
app_repository: https://github.com/puko02/smart-construction-DedSec.git
app_repository_version: main

# Imagens já publicadas no Artifact Registry; o servidor nunca compila a aplicação.
app_compose_file: compose.app.yaml
app_private_ip: 10.20.0.10
db_private_ip: 10.20.0.11
app_registry: us-central1-docker.pkg.dev/projeto-mensal-515620/smart-construction
artifact_registry_host: us-central1-docker.pkg.dev
app_image_tag: latest
app_domain: SEU_DOMINIO
app_public_origin: "https://{{ app_domain }}"
letsencrypt_email: SEU_EMAIL
host_packages:
  - nginx
  - certbot
  - python3-certbot-nginx
update_operating_system: false
update_application_images: false
update_database_image: false
data_disk_device: /dev/disk/by-id/google-smart-app-data
